name: Build Kids TV Launcher APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/kidstv/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KidsTVLauncher"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kidstv.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId "com.kidstv.launcher"
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName "1.1-desktop-first"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <queries>
                  <package android:name="org.xbmc.kodi" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Kids TV Launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <!--
                    康佳自启动管理如果启动本 Activity：
                    Activity 不显示界面，只启动后台监控服务后立即 finish，
                    因此康佳原厂桌面仍可正常进入并负责拉起 Wi-Fi。
                  -->
                  <activity
                      android:name=".MainActivity"
                      android:excludeFromRecents="true"
                      android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".WatchService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kidstv/launcher/MainActivity.java <<'EOF'
          package com.kidstv.launcher;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  startWatchService();
                  finish();
                  overridePendingTransition(0, 0);
              }

              private void startWatchService() {
                  Intent i = new Intent(this, WatchService.class);
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(i);
                      } else {
                          startService(i);
                      }
                  } catch (Throwable ignored) {
                      try { startService(i); } catch (Throwable ignored2) {}
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/kidstv/launcher/BootReceiver.java <<'EOF'
          package com.kidstv.launcher;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  Intent i = new Intent(context, WatchService.class);
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          context.startForegroundService(i);
                      } else {
                          context.startService(i);
                      }
                  } catch (Throwable ignored) {
                      try { context.startService(i); } catch (Throwable ignored2) {}
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/kidstv/launcher/WatchService.java <<'EOF'
          package com.kidstv.launcher;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.ConnectivityManager;
          import android.net.LinkAddress;
          import android.net.LinkProperties;
          import android.net.Network;
          import android.os.Build;
          import android.os.Environment;
          import android.os.IBinder;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.Inet4Address;
          import java.net.Proxy;
          import java.net.URL;

          public class WatchService extends Service {

              private static final String KODI_PACKAGE = "org.xbmc.kodi";
              private static final String CHECK_URL =
                      "http://192.168.31.225:8409/iptv/channels.m3u?mode=hls-direct";

              // 至少给康佳原厂桌面 8 秒时间完成初始化；之后以“实际网络可用”为准。
              private static final long INITIAL_DELAY_MS = 8000L;
              private static final long CHECK_INTERVAL_MS = 1500L;
              private static final int REQUIRED_STABLE_CHECKS = 3;

              private volatile boolean running = false;
              private Thread worker;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startAsForeground();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (!running) {
                      running = true;
                      worker = new Thread(this::monitorLoop, "KidsTV-Watch");
                      worker.start();
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (worker != null) worker.interrupt();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private void startAsForeground() {
                  final String channelId = "kids_tv_launcher_status";
                  NotificationManager nm =
                          (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);

                  if (Build.VERSION.SDK_INT >= 26 && nm != null) {
                      NotificationChannel ch = new NotificationChannel(
                              channelId,
                              "Kids TV Launcher",
                              NotificationManager.IMPORTANCE_MIN);
                      ch.setDescription("等待电视网络就绪后自动启动 Kodi");
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }

                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, channelId)
                          : new Notification.Builder(this);

                  Notification n = b
                          .setContentTitle("Kids TV")
                          .setContentText("等待网络就绪")
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setOngoing(true)
                          .build();

                  startForeground(1001, n);
              }

              private void monitorLoop() {
                  try {
                      Thread.sleep(INITIAL_DELAY_MS);
                  } catch (InterruptedException e) {
                      return;
                  }

                  int stable = 0;

                  while (running) {
                      boolean storage = isStorageReady();
                      boolean network = hasUsableIpv4Network();
                      boolean server = network && checkErsatzTv();

                      if (storage && network && server) {
                          stable++;
                      } else {
                          stable = 0;
                      }

                      if (stable >= REQUIRED_STABLE_CHECKS) {
                          if (launchKodi()) {
                              stopSelf();
                              return;
                          }
                          // 如果系统当下阻止后台拉起 Activity，继续重试。
                          stable = 0;
                      }

                      try {
                          Thread.sleep(CHECK_INTERVAL_MS);
                      } catch (InterruptedException e) {
                          return;
                      }
                  }
              }

              private boolean isStorageReady() {
                  try {
                      return Environment.MEDIA_MOUNTED.equals(
                              Environment.getExternalStorageState());
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private boolean hasUsableIpv4Network() {
                  try {
                      ConnectivityManager cm =
                              (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return false;

                      Network network = cm.getActiveNetwork();
                      if (network == null) return false;

                      LinkProperties lp = cm.getLinkProperties(network);
                      if (lp == null) return false;

                      for (LinkAddress a : lp.getLinkAddresses()) {
                          if (a.getAddress() instanceof Inet4Address
                                  && !a.getAddress().isLoopbackAddress()) {
                              return true;
                          }
                      }
                  } catch (Throwable ignored) {}
                  return false;
              }

              private boolean checkErsatzTv() {
                  HttpURLConnection c = null;
                  BufferedReader r = null;

                  try {
                      URL u = new URL(CHECK_URL);

                      // 明确绕过任何 HTTP 代理，防止局域网 ErsatzTV 请求再次被代理影响。
                      c = (HttpURLConnection) u.openConnection(Proxy.NO_PROXY);
                      c.setConnectTimeout(1800);
                      c.setReadTimeout(2200);
                      c.setUseCaches(false);
                      c.setRequestMethod("GET");
                      c.setRequestProperty("Connection", "close");

                      int code = c.getResponseCode();
                      if (code < 200 || code >= 400) return false;

                      r = new BufferedReader(new InputStreamReader(c.getInputStream()));
                      String first = r.readLine();
                      return first != null && first.startsWith("#EXTM3U");

                  } catch (Throwable ignored) {
                      return false;
                  } finally {
                      try { if (r != null) r.close(); } catch (Throwable ignored) {}
                      if (c != null) c.disconnect();
                  }
              }

              private boolean launchKodi() {
                  try {
                      PackageManager pm = getPackageManager();
                      Intent i = pm.getLaunchIntentForPackage(KODI_PACKAGE);
                      if (i == null) return false;

                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                              | Intent.FLAG_ACTIVITY_CLEAR_TOP
                              | Intent.FLAG_ACTIVITY_SINGLE_TOP);

                      startActivity(i);
                      return true;
                  } catch (Throwable ignored) {
                      return false;
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/KidsTVLauncher-DesktopFirst-v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsTVLauncher-APK
          path: out/KidsTVLauncher-DesktopFirst-v1.1.apk
          if-no-files-found: error
          retention-days: 30
