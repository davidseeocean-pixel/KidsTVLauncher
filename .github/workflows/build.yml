name: Build Kids TV Launcher APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/kidstv/launcher
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KidsTVLauncher"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kidstv.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId "com.kidstv.launcher"
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName "1.2-desktop-first-no-service"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="KidsTVTransparentTheme" parent="android:style/Theme.Translucent.NoTitleBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:backgroundDimEnabled">false</item>
                  <item name="android:windowDisablePreview">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <queries>
                  <package android:name="org.xbmc.kodi" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Kids TV Launcher"
                  android:supportsRtl="true"
                  android:theme="@style/KidsTVTransparentTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:excludeFromRecents="true"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/KidsTVTransparentTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kidstv/launcher/MainActivity.java <<'EOF'
          package com.kidstv.launcher;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.ConnectivityManager;
          import android.net.LinkAddress;
          import android.net.LinkProperties;
          import android.net.Network;
          import android.os.Bundle;
          import android.os.Environment;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.Inet4Address;
          import java.net.Proxy;
          import java.net.URL;

          public class MainActivity extends Activity {

              private static final String KODI_PACKAGE = "org.xbmc.kodi";
              private static final String CHECK_URL =
                      "http://192.168.31.225:8409/iptv/channels.m3u?mode=hls-direct";

              private static final long INITIAL_DELAY_MS = 12000L;
              private static final long CHECK_INTERVAL_MS = 2000L;
              private static final int REQUIRED_STABLE_CHECKS = 3;

              private volatile boolean running = false;
              private volatile boolean launchPosted = false;
              private Thread worker;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  startMonitorIfNeeded();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  startMonitorIfNeeded();
              }

              @Override
              protected void onDestroy() {
                  running = false;
                  if (worker != null) worker.interrupt();
                  super.onDestroy();
              }

              private synchronized void startMonitorIfNeeded() {
                  if (running) return;
                  running = true;
                  launchPosted = false;
                  worker = new Thread(this::monitorLoop, "KidsTV-Monitor");
                  worker.start();
              }

              private void monitorLoop() {
                  try {
                      Thread.sleep(INITIAL_DELAY_MS);
                  } catch (InterruptedException e) {
                      return;
                  }

                  int stable = 0;

                  while (running && !isFinishing()) {
                      boolean storage = isStorageReady();
                      boolean network = hasUsableIpv4Network();
                      boolean server = network && checkErsatzTv();

                      if (storage && network && server) {
                          stable++;
                      } else {
                          stable = 0;
                      }

                      if (stable >= REQUIRED_STABLE_CHECKS && !launchPosted) {
                          launchPosted = true;
                          runOnUiThread(() -> {
                              if (!launchKodi()) {
                                  launchPosted = false;
                              }
                          });
                      }

                      try {
                          Thread.sleep(CHECK_INTERVAL_MS);
                      } catch (InterruptedException e) {
                          return;
                      }
                  }
              }

              private boolean isStorageReady() {
                  try {
                      return Environment.MEDIA_MOUNTED.equals(
                              Environment.getExternalStorageState());
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private boolean hasUsableIpv4Network() {
                  try {
                      ConnectivityManager cm =
                              (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return false;

                      Network network = cm.getActiveNetwork();
                      if (network == null) return false;

                      LinkProperties lp = cm.getLinkProperties(network);
                      if (lp == null) return false;

                      for (LinkAddress a : lp.getLinkAddresses()) {
                          if (a.getAddress() instanceof Inet4Address
                                  && !a.getAddress().isLoopbackAddress()) {
                              return true;
                          }
                      }
                  } catch (Throwable ignored) {}
                  return false;
              }

              private boolean checkErsatzTv() {
                  HttpURLConnection c = null;
                  BufferedReader r = null;

                  try {
                      URL u = new URL(CHECK_URL);
                      c = (HttpURLConnection) u.openConnection(Proxy.NO_PROXY);
                      c.setConnectTimeout(1800);
                      c.setReadTimeout(2200);
                      c.setUseCaches(false);
                      c.setRequestMethod("GET");
                      c.setRequestProperty("Connection", "close");

                      int code = c.getResponseCode();
                      if (code < 200 || code >= 400) return false;

                      r = new BufferedReader(new InputStreamReader(c.getInputStream()));
                      String first = r.readLine();
                      return first != null && first.startsWith("#EXTM3U");
                  } catch (Throwable ignored) {
                      return false;
                  } finally {
                      try { if (r != null) r.close(); } catch (Throwable ignored) {}
                      if (c != null) c.disconnect();
                  }
              }

              private boolean launchKodi() {
                  try {
                      PackageManager pm = getPackageManager();
                      Intent i = pm.getLaunchIntentForPackage(KODI_PACKAGE);
                      if (i == null) return false;

                      i.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP
                              | Intent.FLAG_ACTIVITY_SINGLE_TOP);

                      startActivity(i);
                      running = false;
                      finish();
                      overridePendingTransition(0, 0);
                      return true;
                  } catch (Throwable ignored) {
                      return false;
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/kidstv/launcher/BootReceiver.java <<'EOF'
          package com.kidstv.launcher;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      Intent i = new Intent(context, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                              | Intent.FLAG_ACTIVITY_CLEAR_TOP
                              | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      context.startActivity(i);
                  } catch (Throwable ignored) {
                      // Konka auto-start management can still launch MainActivity directly.
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/KidsTVLauncher-DesktopFirst-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsTVLauncher-APK-v1.2
          path: out/KidsTVLauncher-DesktopFirst-v1.2.apk
          if-no-files-found: error
          retention-days: 30
